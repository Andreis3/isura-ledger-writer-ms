name: Ledger Quality Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-race:
    name: Unit tests (race detector)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run unit suites with race detector
        run: go test -race -count=1 -tags=unit ./tests/unit/... ./internal/infra/nats/... ./internal/infra/postgres/uow/... ./internal/infra/postgres/repository/... ./cmd/backfill

  business-coverage:
    name: Business coverage >= 90%
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run application and domain unit coverage
        run: make unit-cover-business
      - name: Enforce consolidated statements coverage
        shell: bash
        run: |
          set -euo pipefail
          total=$(go tool cover -func=coverage/business.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')
          if [[ -z "$total" ]]; then
            echo "::error::Could not parse total business coverage"
            exit 1
          fi
          echo "Business statement coverage: ${total}%"
          awk -v actual="$total" 'BEGIN { if (actual+0 < 90) exit 1 }' || {
            echo "::error::Business statement coverage is below 90%: ${total}%"
            exit 1
          }

  integration:
    name: API, NATS, PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Atlas CLI for Testcontainers migrations
        run: curl -sSf https://atlasgo.sh | sh
      - name: Run integration tests
        run: make integration-tests
